<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Bordo - Sunfloweredu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --azul-suave: #8EB8CB;
            --azul-escuro: #2C3E50;
            --amarelo-girassol: #F3C623;
            --verde-calmo: #81C784;
            --fundo-site: #F4F7F6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--fundo-site); color: var(--azul-escuro); padding-top: 80px; }

        header {
            position: fixed; top: 0; width: 100%; background: var(--verde-calmo);
            color: white; padding: 15px 50px; display: flex; align-items: center; gap: 20px;
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .voltar-btn { color: white; text-decoration: none; font-size: 1.5em; font-weight: bold; }
        
        .container {
            max-width: 800px; margin: 40px auto; padding: 0 20px;
        }

        .formulario-registro {
            background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05); margin-bottom: 40px;
            border-top: 5px solid var(--verde-calmo);
        }

        .formulario-registro h3 { margin-bottom: 20px; color: var(--azul-escuro); }

        .campo { margin-bottom: 15px; }
        .campo label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9em; }
        .campo input, .campo select, .campo textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none;
        }

        .btn-salvar {
            background-color: var(--verde-calmo); color: white; border: none; padding: 12px 25px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; width: 100%;
            transition: background 0.3s;
        }
        .btn-salvar:hover { background-color: #66BB6A; }

        .historico h3 { margin-bottom: 15px; }
        .registro-card {
            background: white; padding: 20px; border-radius: 10px; border-left: 5px solid var(--amarelo-girassol);
            margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .registro-card h4 { margin-bottom: 5px; }
        .registro-card span { font-size: 0.85em; color: #777; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="voltar-btn">←</a>
        <h2>📊 Diário de Bordo</h2>
    </header>

    <div class="container">
        <!-- Formulário para registrar novo evento -->
        <div class="formulario-registro">
            <h3>Novo Registro</h3>
            <div class="campo">
                <label>Nome do Aluno:</label>
                <input type="text" id="nomeAluno" placeholder="Ex: Lucas">
            </div>
            <div class="campo">
                <label>Gatilho Identificado (O que aconteceu antes?):</label>
                <select id="gatilho">
                    <option value="Barulho excessivo">Barulho excessivo na sala</option>
                    <option value="Mudança de rotina">Mudança repentina de rotina</option>
                    <option value="Frustração com tarefa">Frustração com a tarefa</option>
                    <option value="Luz/Estímulo visual">Excesso de estímulo visual/Luz</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <div class="campo">
                <label>Observações / Como foi resolvido:</label>
                <textarea id="observacao" rows="3" placeholder="Ex: Levei o aluno para o cantinho da calma..."></textarea>
            </div>
            <button class="btn-salvar" onclick="salvarRegistro()">Salvar Registro</button>
        </div>

        <!-- Onde os registros salvos vão aparecer -->
        <div class="historico">
            <h3>Histórico Recente</h3>
            <div id="lista-registros">
                <!-- Exemplo de registro pré-existente -->
                <div class="registro-card">
                    <h4>Aluno: Mariana</h4>
                    <span>Gatilho: Mudança repentina de rotina | Data: Hoje</span>
                    <p>Ficou desregulada quando a aula de artes foi cancelada. Usamos o quadro visual para antecipar a nova atividade.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function salvarRegistro() {
            const nome = document.getElementById('nomeAluno').value;
            const gatilho = document.getElementById('gatilho').value;
            const obs = document.getElementById('observacao').value;

            if (nome === '' || obs === '') {
                alert("Por favor, preencha o nome e a observação!");
                return;
            }

            const novoCard = document.createElement('div');
            novoCard.className = 'registro-card';
            novoCard.innerHTML = `
                <h4>Aluno: ${nome}</h4>
                <span>Gatilho: ${gatilho} | Data: Agora mesmo</span>
                <p>${obs}</p>
            `;

            const lista = document.getElementById('lista-registros');
            lista.insertBefore(novoCard, lista.firstChild); // Adiciona no topo

            // Limpa o formulário
            document.getElementById('nomeAluno').value = '';
            document.getElementById('observacao').value = '';
        }
    </script>
</body>
</html>
